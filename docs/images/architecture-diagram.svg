<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#0B0F17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>
    <linearGradient id="grad-bridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23215C"/>
      <stop offset="100%" stop-color="#14133B"/>
    </linearGradient>
    <linearGradient id="accent-mcp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accent-handbook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="accent-deliverable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background grid styling -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)"/>
  </g>

  <!-- Header -->
  <text x="600" y="52" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700" letter-spacing="-0.5">
    Power BI Desktop Authoring &amp; Handbook Architecture
  </text>
  <text x="600" y="78" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="400">
    Composable End-to-End Workflow: Semantic Modeling MCP + Visual Handbook Generator
  </text>

  <!-- Left Card: powerbi-modeling-mcp -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="320" height="420" rx="12" fill="url(#grad-card)" stroke="#2A3850" stroke-width="1.5"/>
    <rect width="320" height="6" rx="3" fill="url(#accent-mcp)"/>
    
    <!-- Title & Badge -->
    <rect x="20" y="22" width="70" height="20" rx="4" fill="#0369A1" opacity="0.3"/>
    <text x="55" y="36" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="700" letter-spacing="0.5">MCP LAYER</text>
    <text x="20" y="66" fill="#F1F5F9" font-size="18" font-weight="700">powerbi-modeling-mcp</text>
    <text x="20" y="85" fill="#64748B" font-size="12">Microsoft Official Model Context Protocol</text>

    <!-- Scope items -->
    <g transform="translate(20, 105)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Semantic Model Management</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">Tables, Columns, Relationships, TMDL</text>
      <circle cx="260" cy="29" r="8" fill="#0284C7" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#38BDF8" font-size="10">✓</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">DAX Calculations &amp; Queries</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">Measures creation, refactoring &amp; test</text>
      <circle cx="260" cy="29" r="8" fill="#0284C7" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#38BDF8" font-size="10">✓</text>
    </g>

    <g transform="translate(20, 245)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Model Rules &amp; Best Practices</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">Validation against schema &amp; standards</text>
      <circle cx="260" cy="29" r="8" fill="#0284C7" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#38BDF8" font-size="10">✓</text>
    </g>

    <!-- Scope Constraint Notice -->
    <g transform="translate(20, 325)">
      <rect width="280" height="72" rx="8" fill="#111827" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="14" y="22" fill="#F87171" font-size="11" font-weight="700">CANNOT MODIFY REPORT CANVAS</text>
      <text x="14" y="40" fill="#94A3B8" font-size="10">Cannot edit visual pages, field wells,</text>
      <text x="14" y="55" fill="#94A3B8" font-size="10">or visual formatting properties.</text>
    </g>
  </g>

  <!-- Center Bridge: model-contract -->
  <g transform="translate(420, 130)" filter="url(#shadow)">
    <rect width="360" height="380" rx="12" fill="url(#grad-bridge)" stroke="#4338CA" stroke-width="1.5"/>
    <text x="180" y="36" text-anchor="middle" fill="#A5B4FC" font-size="11" font-weight="700" letter-spacing="1">CONTRACT BRIDGE</text>
    <text x="180" y="66" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">handbook.mjs model-contract</text>

    <!-- Contract Payload Box -->
    <rect x="25" y="90" width="310" height="265" rx="8" fill="#0B0D1B" stroke="#4F46E5" stroke-width="1"/>
    <text x="40" y="118" fill="#818CF8" font-family="Consolas, monospace" font-size="11">// Extracted Semantic Model Contract</text>
    <text x="40" y="142" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11"><tspan fill="#38BDF8">tables</tspan>: ["Incident", "Team", ...]</text>
    <text x="40" y="166" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11"><tspan fill="#38BDF8">columns</tspan>: ["Team[Name]", ...]</text>
    <text x="40" y="190" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11"><tspan fill="#38BDF8">measures</tspan>: ["Measures[Open]", ...]</text>
    
    <text x="40" y="222" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">// Exact Visual Role Mappings:</text>
    <text x="40" y="244" fill="#A7F3D0" font-family="Consolas, monospace" font-size="10">  Measures[Open] -> card.value</text>
    <text x="40" y="264" fill="#A7F3D0" font-family="Consolas, monospace" font-size="10">  Team[Name]     -> barChart.yAxis</text>
    <text x="40" y="284" fill="#A7F3D0" font-family="Consolas, monospace" font-size="10">  Severity       -> matrix.columns</text>
    <text x="40" y="318" fill="#6EE7B7" font-family="Consolas, monospace" font-size="10">✓ Automated AI Agent Verification</text>
  </g>

  <!-- Right Card: powerbi-desktop-handbook -->
  <g transform="translate(820, 110)" filter="url(#shadow)">
    <rect width="320" height="420" rx="12" fill="url(#grad-card)" stroke="#2A3850" stroke-width="1.5"/>
    <rect width="320" height="6" rx="3" fill="url(#accent-handbook)"/>
    
    <!-- Title & Badge -->
    <rect x="20" y="22" width="90" height="20" rx="4" fill="#B45309" opacity="0.3"/>
    <text x="65" y="36" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700" letter-spacing="0.5">REPORT LAYER</text>
    <text x="20" y="66" fill="#F1F5F9" font-size="18" font-weight="700">powerbi-desktop-handbook</text>
    <text x="20" y="85" fill="#64748B" font-size="12">Version-Aware Visual Catalog &amp; Guide</text>

    <!-- Scope items -->
    <g transform="translate(20, 105)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Exact Build 2.150 Role Evidence</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">37 gallery icons, verified role orders</text>
      <circle cx="260" cy="29" r="8" fill="#D97706" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#FBBF24" font-size="10">✓</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Format Pane Settings Guidance</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">Theme-schema properties &amp; UI paths</text>
      <circle cx="260" cy="29" r="8" fill="#D97706" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#FBBF24" font-size="10">✓</text>
    </g>

    <g transform="translate(20, 245)">
      <rect width="280" height="58" rx="8" fill="#141C2B" stroke="#2A3850" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Standalone Offline HTML Guide</text>
      <text x="14" y="40" fill="#94A3B8" font-size="11">Desktop-like shell, interactive checklist</text>
      <circle cx="260" cy="29" r="8" fill="#D97706" opacity="0.2"/>
      <text x="260" y="33" text-anchor="middle" fill="#FBBF24" font-size="10">✓</text>
    </g>

    <g transform="translate(20, 325)">
      <rect width="280" height="72" rx="8" fill="#111827" stroke="#10B981" stroke-width="1"/>
      <text x="14" y="22" fill="#34D399" font-size="11" font-weight="700">OUTPUT: MANUAL BUILD GUIDE</text>
      <text x="14" y="40" fill="#94A3B8" font-size="10">Single-file standalone HTML with zero</text>
      <text x="14" y="55" fill="#94A3B8" font-size="10">runtime packages or network calls.</text>
    </g>
  </g>

  <!-- Flow connecting arrows -->
  <path d="M 380 250 L 415 250" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <polygon points="415,246 423,250 415,254" fill="#38BDF8"/>
  <text x="400" y="235" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="600">Inspects</text>

  <path d="M 820 250 L 785 250" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <polygon points="785,246 777,250 785,254" fill="#FBBF24"/>
  <text x="800" y="235" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="600">Extracts</text>

  <!-- Bottom Connecting Action Banner -->
  <g transform="translate(180, 570)" filter="url(#shadow)">
    <rect width="840" height="54" rx="27" fill="#18173D" stroke="#6366F1" stroke-width="1.5"/>
    <text x="420" y="33" text-anchor="middle" fill="#E0E7FF" font-size="13" font-weight="500">
      ⚡ <tspan font-weight="700" fill="#FFFFFF">End-to-End Workflow:</tspan> Model in <tspan fill="#38BDF8" font-weight="700">powerbi-modeling-mcp</tspan> ➔ Verify with <tspan fill="#A5B4FC" font-weight="700">model-contract</tspan> ➔ Assemble report with <tspan fill="#FBBF24" font-weight="700">handbook guide</tspan>
    </text>
  </g>
</svg>
